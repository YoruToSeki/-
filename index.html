<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>貿易実務検定・個人トレーナー</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2b3a55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --ink: #22262f; --ink-soft: #5c6270; --paper: #faf7f0; --card: #ffffff;
    --line: #ded6c2; --navy: #2b3a55; --navy-dark: #1c2740;
    --amber: #b8743a; --amber-bg: #f4e6d5; --teal: #2f6e62; --teal-bg: #e1efe9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    padding-bottom: 84px;
  }
  header { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); }
  header .eyebrow { font-size: 11px; letter-spacing: 1px; color: var(--ink-soft); margin-bottom: 4px; }
  header h1 { font-family: "Hiragino Mincho ProN", serif; font-size: 22px; font-weight: 600; margin: 0; color: var(--navy-dark); }
  .synctag { font-size: 10px; color: var(--teal); margin-top: 4px; }
  .synctag.offline { color: var(--amber); }
  .tabpanel { padding: 20px; display: none; }
  .tabpanel.active { display: block; }
  .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 18px; padding-bottom: 4px; }
  .chip { flex-shrink: 0; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .chip.active { border-color: var(--navy); background: var(--navy); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 24px 20px; box-shadow: 0 1px 3px rgba(34,38,47,0.06); }
  .cat-label { font-size: 11px; color: var(--amber); font-weight: 600; margin-bottom: 10px; }
  .qtext { font-size: 16px; line-height: 1.7; margin: 0; }
  .answer-block { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); display: none; }
  .answer-block.show { display: block; }
  .answer-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .answer-text { font-size: 15px; font-weight: 600; color: var(--navy-dark); margin: 0 0 8px; }
  .exp-text { font-size: 13px; color: var(--ink-soft); line-height: 1.6; margin: 0; }
  button { font-family: inherit; cursor: pointer; }
  .btn-primary { margin-top: 20px; width: 100%; padding: 12px 0; border-radius: 4px; border: none; background: var(--navy); color: #fff; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .grade-row { margin-top: 18px; display: flex; gap: 10px; }
  .btn-wrong, .btn-correct { flex: 1; padding: 12px 0; border-radius: 4px; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-wrong { border: 1px solid var(--amber); background: var(--amber-bg); color: var(--amber); }
  .btn-correct { border: 1px solid var(--teal); background: var(--teal-bg); color: var(--teal); }
  .btn-ghost { margin-top: 14px; width: 100%; padding: 10px 0; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .empty { color: var(--ink-soft); text-align: center; padding: 40px; }
  form { display: flex; flex-direction: column; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--ink-soft); }
  input, textarea { width: 100%; padding: 10px 12px; border-radius: 4px; border: 1px solid var(--line); font-size: 14px; font-family: inherit; color: var(--ink); background: var(--card); }
  textarea { resize: vertical; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 16px; color: var(--navy-dark); }
  .toast { color: var(--teal); font-size: 13px; margin-top: 10px; text-align: center; display: none; }
  .toast.show { display: block; }
  .bankinfo { font-size: 12px; color: var(--ink-soft); margin-top: 24px; line-height: 1.7; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; margin-bottom: 10px; }
  .stat-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .stat-bar-bg { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .stat-bar-fill { height: 100%; }
  .weak-card { background: var(--amber-bg); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
  .weak-cat { font-size: 11px; color: var(--amber); font-weight: 600; margin-bottom: 3px; }
  .weak-q { font-size: 13px; color: var(--ink); line-height: 1.5; }
  .weak-meta { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
  .navbtn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border: none; background: transparent; color: var(--ink-soft); }
  .navbtn.active { color: var(--navy); }
  .navbtn svg { width: 18px; height: 18px; }
  .navbtn span { font-size: 10px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
</style>
</head>

  <div class="eyebrow">貿易実務検定・個人トレーナー</div>

</header>

<div id="tab-study" class="tabpanel active">

  <div id="cardArea"><div class="loading">読み込み中...</div></div>

    別の問題にする
  </button>
</div>

<div id="tab-add" class="tabpanel">
  <h2>問題を追加</h2>
  <form id="addForm">
    <label>カテゴリー<input id="f-category" placeholder="例:為替、保険、関税..."></label>
    <label>問題文<textarea id="f-q" rows="3" placeholder="間違えた問題の本文を貼り付け"></textarea></label>
    <label>正解<textarea id="f-a" rows="2" placeholder="正しい答え"></textarea></label>
    <label>解説(任意)<textarea id="f-exp" rows="2" placeholder="なぜそうなるか、補足があれば"></textarea></label>
    <button type="submit" class="btn-primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg>
      問題バンクに追加
    </button>
  </form>
  <p class="toast" id="toast">追加しました</p>
  <p class="bankinfo" id="bankinfo"></p>
</div>

<div id="tab-stats" class="tabpanel">
  <h2>カテゴリー別 正答率</h2>
  <div id="catStats"></div>
  <h2 style="margin-top:28px;">苦手トップ5</h2>
  <div id="weakList"></div>
</div>

<nav>
  <button class="navbtn active" data-tab="study" onclick="switchTab('study')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>学習</span>
  </button>
  <button class="navbtn" data-tab="add" onclick="switchTab('add')">

  </button>
  <button class="navbtn" data-tab="stats" onclick="switchTab('stats')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-3"/></svg>
    <span>統計</span>
  </button>
</nav>

  { id: "s22", category: "会社組織", q: "持株会社が採用される理由を2つ挙げてください。", a: "事業リスクの遮断、M&Aのしやすさ(意思決定の一元化も可)", exp: "" },

let questions = [];
let category = "すべて";
let current = null;
let revealed = false;

function setSyncTag(text, offline) {
  const tag = document.getElementById("syncTag");
  tag.textContent = text;
  tag.classList.toggle("offline", !!offline);
}

async function loadQuestions() {
  try {
    const { data, error } = await sb.from("questions").select("*").order("created_at", { ascending: true });
    if (error) throw error;
    if (!data || data.length === 0) {
      const { error: insertErr } = await sb.from("questions").insert(SEED_QUESTIONS);
      if (insertErr) throw insertErr;
      const retry = await sb.from("questions").select("*").order("created_at", { ascending: true });
      questions = retry.data || [];
    } else {
      questions = data;
    }
    setSyncTag("同期済み(全端末で共有)", false);
  } catch (e) {
    console.error(e);
    setSyncTag("オフライン(通信を確認してください)", true);
    questions = SEED_QUESTIONS.map(q => ({ ...q, correct: 0, wrong: 0 }));
  }
  renderChips();
  pickNext();
  renderBankInfo();
}

function mastery(item) { return (item.correct || 0) - (item.wrong || 0) * 1.5; }

function weightedPick(items) {
  if (items.length === 0) return null;
  const scores = items.map(it => Math.max(0.5, 5 - mastery(it)));
  const total = scores.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) { r -= scores[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

function getCategories() { return Array.from(new Set(questions.map(q => q.category))); }
function getPool() { return category === "すべて" ? questions : questions.filter(q => q.category === category); }

function renderChips() {
  const chips = document.getElementById("chips");
  const cats = ["すべて", ...getCategories()];
  chips.innerHTML = cats.map(c => `<button class="chip ${c === category ? "active" : ""}" onclick="setCategory('${c.replace(/'/g, "\\'")}')">${c}</button>`).join("");
}

function setCategory(c) { category = c; renderChips(); pickNext(); }

function pickNext() {
  current = weightedPick(getPool());
  revealed = false;
  renderCard();
}

function reveal() { revealed = true; renderCard(); }

async function grade(isCorrect) {
  if (!current) return;
  const updated = {
    correct: (current.correct || 0) + (isCorrect ? 1 : 0),
    wrong: (current.wrong || 0) + (isCorrect ? 0 : 1),
  };
  questions = questions.map(q => q.id === current.id ? { ...q, ...updated } : q);
  try {
    await sb.from("questions").update(updated).eq("id", current.id);
  } catch (e) { console.error(e); }
  setTimeout(pickNext, 150);
}

function renderCard() {
  const area = document.getElementById("cardArea");
  if (!current) { area.innerHTML = `<p class="empty">このカテゴリーには問題がありません</p>`; return; }
  area.innerHTML = `
    <div class="card">
      <div class="cat-label">${current.category}</div>
      <p class="qtext">${current.q}</p>
      <div class="answer-block ${revealed ? "show" : ""}">
        <div class="answer-label">解答</div>
        <p class="answer-text">${current.a}</p>
        ${current.exp ? `<p class="exp-text">${current.exp}</p>` : ""}
      </div>
      ${!revealed
        ? `<button class="btn-primary" onclick="reveal()">解答を見る</button>`
        : `<div class="grade-row"><button class="btn-wrong" onclick="grade(false)">✕ 間違えた</button><button class="btn-correct" onclick="grade(true)">✓ 正解した</button></div>`
      }
    </div>`;
}

function switchTab(name) {
  document.querySelectorAll(".tabpanel").forEach(p => p.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  document.querySelectorAll(".navbtn").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  if (name === "stats") renderStats();
  if (name === "add") renderBankInfo();
}

function renderBankInfo() {
  document.getElementById("bankinfo").textContent = `現在の問題バンク:${questions.length}問(カテゴリー数:${getCategories().length})`;
}

document.getElementById("addForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const cat = document.getElementById("f-category").value.trim();
  const q = document.getElementById("f-q").value.trim();
  const a = document.getElementById("f-a").value.trim();
  const exp = document.getElementById("f-exp").value.trim();
  if (!cat || !q || !a) return;
  const item = { id: "u" + Date.now(), category: cat, q, a, exp, correct: 0, wrong: 0 };
  try {
    await sb.from("questions").insert(item);
    questions.push(item);
  } catch (err) { console.error(err); alert("保存に失敗しました。通信環境を確認してください。"); return; }
  document.getElementById("addForm").reset();
  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1800);
  renderChips();
  renderBankInfo();
});

function renderStats() {
  const map = {};
  questions.forEach(q => {
    const c = q.correct || 0, w = q.wrong || 0;
    if (!map[q.category]) map[q.category] = { correct: 0, wrong: 0 };
    map[q.category].correct += c; map[q.category].wrong += w;
  });
  document.getElementById("catStats").innerHTML = Object.entries(map).map(([name, v]) => {
    const total = v.correct + v.wrong;
    const rate = total > 0 ? Math.round((v.correct / total) * 100) : null;
    const barColor = rate === null ? "var(--line)" : (rate >= 70 ? "var(--teal)" : "var(--amber)");
    return `<div class="stat-card"><div class="stat-row"><span>${name}</span><span style="color:var(--ink-soft)">${rate === null ? "未回答" : rate + "%"}</span></div><div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${rate ?? 0}%;background:${barColor}"></div></div></div>`;
  }).join("");

  const weakest = questions.filter(q => (q.correct || 0) + (q.wrong || 0) > 0).sort((a, b) => mastery(a) - mastery(b)).slice(0, 5);
  document.getElementById("weakList").innerHTML = weakest.length === 0
    ? `<p style="color:var(--ink-soft);font-size:13px;">まだ回答履歴がありません</p>`
    : weakest.map(q => `<div class="weak-card"><div class="weak-cat">${q.category}</div><div class="weak-q">${q.q}</div><div class="weak-meta">正解 ${q.correct || 0} / 誤答 ${q.wrong || 0}</div></div>`).join("");
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

loadQuestions();
</script>
</body>
</html>
